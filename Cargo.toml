[package]
name = "pl0_vm_rs"
version = "1.4.1"
edition = "2021"

[dependencies]
num_enum = "0.7.5"
rust-i18n = "3.1.5"
sys-locale = "0.3.2"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "vm"
harness = false

# the binary has no benchmarks itself, this lets `cargo bench -- <criterion flags>` work
[[bin]]
name = "pl0_vm_rs"
path = "src/main.rs"
bench = false
